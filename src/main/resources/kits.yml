# Kits. Contents are captured from an admin's inventory (/kit create <name>, or the Kit Management GUI) and stored
# as serialized items below - you normally never edit the "contents" blocks by hand.
settings:
  premade-installed: false              # internal: premade kits are installed once on a fresh server; /kit premade adds any that are missing
  allow-clear-inventory: false          # allows kits with clear-inventory: true
  block-while-combat-tagged: true
  banned-materials: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW, DEBUG_STICK, KNOWLEDGE_BOOK, SPAWNER]

