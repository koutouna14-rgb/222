# Daily quests. Everyone sees the same set each day: `selection` chooses how many of each difficulty are drawn from the pool.
# HARD LIMIT: at most 3 quests are active per day in total, however high `selection` is set.
enabled: true
content-version: 2   # internal: lets updates add NEW quests to the pool once (never overwrites or restores deleted ones)
reset:
  timezone: UTC                  # Java zone id, e.g. Asia/Manila
  time: "00:00"                  # HH:mm local time
selection:
  EASY: 1
  MEDIUM: 1
  HARD: 1

# Objective types: KILLS, STREAK (reach N), CAPTURE_SECONDS, CAPTURE_PAYOUTS, BOUNTY_CLAIMS, KIT_CLAIMS
