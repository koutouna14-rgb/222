# AetherFFA messages. MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html
# Placeholders are written as <name>. <prefix> and <currency> are always available.
# Player-supplied values (names, team names, chat) are inserted as plain text and cannot inject formatting.
# New keys added by plugin updates are appended automatically; your edits are never overwritten.
prefix: "<#4DA6FF>Aether</#4DA6FF> <dark_gray>»</dark_gray> "

general:
  no-permission: "<prefix><red>You don't have permission to do that."
  players-only: "<prefix><red>Only players can use this."
  error: "<prefix><red>Something went wrong. Try again, or tell staff if it keeps happening."
  world-disabled: "<prefix><gray>That feature is not active in this world."
  invalid-amount: "<prefix><red>That is not a valid amount."
  player-offline: "<prefix><red><player> is not online."
  unknown-player: "<prefix><red>No known player named <player>."
  unknown-board: "<prefix><red>Unknown leaderboard."
  save-failed: "<prefix><red>Could not save: <error>"
  prompt-cancel-hint: "<gray>Type <white>cancel</white> to abort. You have 60 seconds."
  prompt-cancelled: "<prefix><gray>Cancelled."
  prompt-expired: "<prefix><gray>Input timed out."

economy:
  usage: "<prefix><gray>/aether [balance [player] | pay <player> <amount> | top]"
  admin-usage: "<prefix><gray>/aether admin <give|take|set> <player> <amount>"
  balance: "<prefix><gray>Balance: <#B57BFF><balance>"
  balance-other: "<prefix><white><player><gray> has <#B57BFF><balance>"
  paid: "<prefix><gray>You sent <#B57BFF><amount><gray> to <white><player><gray>."
  received: "<prefix><gray>You received <#B57BFF><amount><gray> from <white><player><gray>."
  insufficient: "<prefix><red>You don't have enough <currency>."
  max-balance: "<prefix><red>That would exceed the maximum balance."
  transfer-limit: "<prefix><red>That transfer is outside the allowed limits, or you are on cooldown."
  transfer-failed: "<prefix><red>The transfer could not be completed."
  top-line: "<gray>#<rank> <white><player> <dark_gray>- <#B57BFF><amount>"
  history-line: "<gray><delta> <dark_gray>(<balance>) <dark_gray>- <white><reason>"
  no-history: "<prefix><gray>No transactions yet."
  kill-reward: "<prefix><gray>+<#B57BFF><amount><gray> for killing <white><player>"
  admin-done: "<prefix><gray><white><player><gray> now has <#B57BFF><balance>"
  admin-failed: "<prefix><red>Could not change <player>'s balance (limits or insufficient funds)."

kits:
  unknown: "<prefix><red>That kit does not exist or is disabled."
  claimed: "<prefix><gray>You received the <white><kit><gray> kit."
  locked: "<prefix><red>You haven't unlocked that kit."
  cooldown: "<prefix><yellow>That kit is on cooldown for <time>."
  no-space: "<prefix><red>Not enough inventory space for that kit."
  no-space-other: "<prefix><red><player> does not have enough inventory space."
  unavailable-world: "<prefix><gray>That kit isn't available in this world."
  in-combat: "<prefix><red>You can't claim kits while in combat."
  purchased: "<prefix><gray>Unlocked <white><kit><gray> for <#B57BFF><price><gray>."
  already-owned: "<prefix><gray>You already own that kit."
  upgraded: "<prefix><gray><white><kit><gray> upgraded to level <white><level><gray>."
  max-level: "<prefix><gray>That kit is at its maximum level."
  given: "<prefix><gray>Gave <white><kit><gray> to <white><player><gray>."
  saved: "<prefix><gray>Kit <white><kit><gray> saved from your inventory."
  exists: "<prefix><red>A kit with that name already exists."
  invalid-name: "<prefix><red>Kit names are lowercase a-z, 0-9, - or _ (2-24 characters)."
  invalid-item: "<prefix><red>Cannot save kit: <item> is not allowed (banned, oversized stack, or invalid)."
  reloaded: "<prefix><gray>kits.yml reloaded."
  usage-admin: "<prefix><gray>/kit <create|edit|delete> <name> | /kit give <player> <name> | /kit premade"
  premade-installed: "<prefix><gray>Added <white><count><gray> premade kit(s). Existing kits were not touched."
  premade-none: "<prefix><gray>All premade kits already exist."

bounty:
  usage: "<prefix><gray>/bounty [set <player> <amount> | top | info <player>]"
  disabled: "<prefix><red>Bounties are disabled."
  self: "<prefix><red>You can't place a bounty on yourself."
  teammate: "<prefix><red>You can't place a bounty on a teammate."
  target-offline: "<prefix><red>That player is not online."
  amount-range: "<prefix><red>Bounties must be between <min> and <max>."
  target-cap: "<prefix><red>That player's total bounty is capped at <max>."
  cooldown: "<prefix><red>Wait a moment before placing another bounty."
  placed: "<prefix><gray>Bounty of <#B57BFF><amount><gray> placed on <white><player><gray>. Total: <#B57BFF><total>"
  on-you: "<prefix><red><player> added to the bounty on you. Total: <total>"
  broadcast: "<prefix><white><player><gray> placed <#B57BFF><amount><gray> on <white><target><gray> (total <#B57BFF><total><gray>)."
  claimed: "<prefix><white><player><gray> claimed <#B57BFF><amount><gray> for killing <white><target><gray>."
  refunded: "<prefix><gray>A bounty you placed ended. Refunded <#B57BFF><amount><gray>."
  none: "<prefix><gray>No active bounties."
  top-line: "<gray>#<rank> <white><player> <dark_gray>- <#B57BFF><amount>"
  info: "<prefix><white><player><gray> has <#B57BFF><amount><gray> on their head (<count> contributions)."
  info-admin-line: "<dark_gray> - <white><placer> <#B57BFF><amount> <gray>expires in <expires>"
  removed: "<prefix><gray>Removed <count> contribution(s) on <white><player><gray> and refunded placers."

teams:
  usage: "<prefix><gray>/team create <name> | invite <player> | accept|deny <name> | kick|promote <player> | leave | disband | chat [msg] | info [player]"
  usage-tc: "<prefix><gray>/tc <message>"
  usage-admin: "<prefix><gray>/team admin <list|info <team>|disband <team>>"
  disabled: "<prefix><red>Teams are disabled."
  already-in-team: "<prefix><red>You are already in a team."
  not-in-team: "<prefix><red>You are not in a team."
  leader-only: "<prefix><red>Only the team leader can do that."
  invalid-name: "<prefix><red>Invalid team name (3-16 letters, numbers or _)."
  name-taken: "<prefix><red>That team name is taken."
  switch-cooldown: "<prefix><red>Wait <time> before changing teams again."
  created: "<prefix><gray>Team <white><team><gray> created."
  cannot-self: "<prefix><red>You can't do that to yourself."
  target-in-team: "<prefix><red><player> is already in a team."
  full: "<prefix><red>That team is full."
  too-many-invites: "<prefix><red>That player has too many pending invitations."
  invite-sent: "<prefix><gray>Invited <white><player><gray>."
  invite-received: "<prefix><white><player><gray> invited you to <white><team><gray>. <click:run_command:'/team accept <p_team>'><#4DA6FF>[Accept]</#4DA6FF></click> <click:run_command:'/team deny <p_team>'><red>[Deny]</red></click> <dark_gray>(<seconds>s)"
  no-invite: "<prefix><red>No matching invitation."
  invite-denied: "<prefix><gray>Invitation declined."
  joined: "<prefix><gray>You joined <white><team><gray>."
  member-joined: "<prefix><white><player><gray> joined the team."
  member-left: "<prefix><white><player><gray> left the team."
  left: "<prefix><gray>You left <white><team><gray>."
  not-member: "<prefix><red><player> is not in your team."
  kicked: "<prefix><gray>Removed <white><player><gray> from the team."
  you-were-kicked: "<prefix><red>You were removed from <team>."
  promoted: "<prefix><white><player><gray> is now the team leader."
  leader-cannot-leave: "<prefix><red>Promote another member first, or disband the team."
  disbanded: "<prefix><gray>Team <white><team><gray> was disbanded."
  disbanded-by-staff: "<prefix><red>Team <team> was disbanded by staff."
  chat-on: "<prefix><gray>Team chat <green>ON<gray>. Your messages go to teammates only."
  chat-off: "<prefix><gray>Team chat <red>OFF<gray>."
  friendly-fire: "<prefix><gray>You can't hurt your teammates."
  info: "<prefix><white><team><gray> (<count>/<max>): <white><members>"
  info-none: "<prefix><red>No team found."
  admin-line: "<gray><team> <dark_gray>- <count> members, leader <white><leader>"

zones:
  usage: "<prefix><gray>/capturezone create <id>|redefine <id>|createcircle <id> <radius>|delete|enable|disable|info <id>|list|set <id> <key> <value>|gui <id>|status <dark_gray>(create/redefine use your WorldEdit selection)"
  entered: "<prefix><gray>You entered <white><zone><gray>."
  left: "<prefix><gray>You left <white><zone><gray>."
  reward: "<prefix><gray>+<#B57BFF><amount><gray> from <white><zone>"
  actionbar: "<#4DA6FF><zone> <dark_gray>| <white><status> <dark_gray>| <gray>next payout in <white><seconds>s"
  limit-reached: "<prefix><gray>You reached this zone's hourly reward cap."
  status:
    disabled: "Disabled"
    world_disabled: "Inactive here"
    empty: "Empty"
    active: "Earning"
    contested: "Contested"
    grace: "Resuming in <seconds>s"
    waiting_min: "Waiting for more players"
    too_many: "Too crowded"
    no_majority: "No majority"
    ineligible: "Not earning (AFK, protected or safe zone)"
  not-in-zone: "<prefix><gray>You are not inside a capture zone."
  status-line: "<prefix><white><zone><gray>: <white><status><gray> | occupants <occupants>, eligible <eligible>"
  unknown: "<prefix><red>No such zone."
  exists: "<prefix><red>A zone with that id already exists."
  invalid-id: "<prefix><red>Zone ids are a-z, 0-9, - or _ (2-24)."
  need-selection: "<prefix><red>Make a selection first: WorldEdit's //wand (or //pos1 and //pos2), or //sel cyl for a circle. Without WorldEdit, use /capturezone pos1 and pos2."
  we-unsupported: "<prefix><red>Zones support WorldEdit cuboid and cylinder selections only. Use //sel cuboid or //sel cyl."
  we-elliptical: "<prefix><red>Cylinder selections must be circular (same X and Z radius)."
  we-failed: "<prefix><red>Could not read your WorldEdit selection. Check the console."
  use-worldedit: "<prefix><gray>WorldEdit is installed, so select with <white>//wand<gray> (or <white>//pos1<gray>/<white>//pos2<gray>) then run <white>/capturezone create <id><gray>."
  selection-world: "<prefix><red>Both corners must be in the same world."
  bad-radius: "<prefix><red>Radius must be between 1 and 500."
  bad-key: "<prefix><red>Unknown setting key."
  pos-set: "<prefix><gray>Corner <n> set to your position."
  created: "<prefix><gray>Zone <white><zone><gray> created."
  updated: "<prefix><gray>Zone updated."
  done: "<prefix><gray>Done: <white><zone>"
  list-line: "<gray><zone> <dark_gray>- <white><world> <dark_gray>- <gray><status>"

quests:
